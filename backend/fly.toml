app = "my-portfolio-dawn-glade-2810"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "strapi_data"
  destination = "/app/.tmp"
